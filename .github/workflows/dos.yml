#一个mod,一个server端+hl2dm
name: my_build_win32--2023

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  build-srceng-server-win-32-hl2dm:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.3.290.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
    - name: Build-sv
      run: |

        git submodule init;git submodule update
        #sudo apt update;sudo apt upgrade;sudo apt-get install -f -y gdb libopenal-dev g++-multilib gcc-multilib libpng-dev libjpeg-dev libfreetype6-dev libfontconfig1-dev libcurl4-gnutls-dev libsdl2-dev zlib1g-dev libbz2-dev libedit-dev
        ./waf.bat configure -T release --prefix=./win --disable-warns --enable-opus
        ./waf.bat install -j4

        New-Item -ItemType Directory -Force -Path ./win | Out-Null
        cat build/config.log >./win/info.txt
        Get-ChildItem -Recurse -Path ./win -Include *.lib,*.pdb | Remove-Item -Force

    - uses: actions/upload-artifact@v4
      with:
        name: hl2dm-win64
        path: ./win
        if-no-files-found: error


  build-srceng-win-hl2dm:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.3.290.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
    - name: Build
      run: |
        #
        git submodule init;git submodule update
        ./waf.bat configure -T release -4 --prefix=./win --disable-warns --enable-opus

        ./waf.bat install -j4
        New-Item -ItemType Directory -Force -Path ./win | Out-Null
        cat build/config.log > ./win/info.txt
        Get-ChildItem -Recurse -Path ./win -Include *.lib,*.pdb | Remove-Item -Force
    - uses: actions/upload-artifact@v4
      with:
        name: hl2dm-win32
        path: ./win
        if-no-files-found: error

  build-srceng-win-arm64:
    runs-on: windows-11-arm

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Setup MSVC arm64 (VS2022 / MSVC 143)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        vsversion: '2022'
        arch: arm64
    - name: Install Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.3.290.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
    - name: Install ARM64 dependencies via vcpkg
      run: |
        # Install vcpkg if not already present
        $vcpkgRoot = if (Test-Path "C:\vcpkg") { "C:\vcpkg" } elseif (Test-Path "$env:VCPKG_ROOT") { $env:VCPKG_ROOT } else { $null }
        if (-not $vcpkgRoot) {
          git clone --depth 1 https://github.com/Microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          $vcpkgRoot = "C:\vcpkg"
        }
        # Install ARM64 packages
        & "$vcpkgRoot\vcpkg" install zlib:arm64-windows libpng:arm64-windows libjpeg-turbo:arm64-windows opus:arm64-windows sdl2:arm64-windows --clean-after-build
        # Copy ARM64 .lib files to project lib directory (both arm64 and aarch64 for compatibility)
        New-Item -ItemType Directory -Force -Path ./lib/win32/arm64 | Out-Null
        New-Item -ItemType Directory -Force -Path ./lib/win32/aarch64 | Out-Null
        $vcpkgLib = "$vcpkgRoot\installed\arm64-windows\lib"
        if (Test-Path $vcpkgLib) {
          Get-ChildItem "$vcpkgLib\*.lib" | Copy-Item -Destination ./lib/win32/arm64/ -Force
          Get-ChildItem "$vcpkgLib\*.lib" | Copy-Item -Destination ./lib/win32/aarch64/ -Force
          # Rename zlib.lib -> libz.lib, jpeg.lib -> libjpeg.lib for compatibility
          foreach ($dir in @("./lib/win32/arm64", "./lib/win32/aarch64")) {
            if (Test-Path "$dir/zlib.lib") {
              Copy-Item "$dir/zlib.lib" "$dir/libz.lib" -Force
            }
            if (Test-Path "$dir/jpeg.lib") {
              Copy-Item "$dir/jpeg.lib" "$dir/libjpeg.lib" -Force
            }
          }
        }
        # Copy ARM64 DLLs
        $vcpkgBin = "$vcpkgRoot\installed\arm64-windows\bin"
        if (Test-Path $vcpkgBin) {
          Get-ChildItem "$vcpkgBin\*.dll" | Copy-Item -Destination ./lib/win32/arm64/ -Force
          Get-ChildItem "$vcpkgBin\*.dll" | Copy-Item -Destination ./lib/win32/aarch64/ -Force
        }
        Write-Host "ARM64 libraries in ./lib/win32/arm64/:"
        Get-ChildItem ./lib/win32/arm64/ -Name
        Write-Host "ARM64 libraries in ./lib/win32/aarch64/:"
        Get-ChildItem ./lib/win32/aarch64/ -Name
    - name: Build Windows ARM64
      run: |
        git submodule init;git submodule update
        ./waf.bat configure -T release --prefix=./win --disable-warns --enable-opus
        ./waf.bat install -j4
        New-Item -ItemType Directory -Force -Path ./win | Out-Null
        cat build/config.log > ./win/info.txt
        Get-ChildItem -Recurse -Path ./win -Include *.lib,*.pdb | Remove-Item -Force
    - uses: actions/upload-artifact@v4
      with:
        name: hl2dm-win-arm64
        path: ./win
        if-no-files-found: error
    - name: Upload config.log on failure
      if: failure()
      run: |
        New-Item -ItemType Directory -Force -Path ./diag | Out-Null
        if (Test-Path build/config.log) {
          Copy-Item build/config.log ./diag/config.log
        }
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: hl2dm-win-arm64-diag
        path: ./diag
        if-no-files-found: ignore
