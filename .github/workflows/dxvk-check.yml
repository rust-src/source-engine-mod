name: DXVK Module Check

on:
  push:
    branches:
      - "*"
    paths:
      - "materialsystem/shaderapidxxvk/**"
      - ".github/workflows/dxvk-check.yml"
  pull_request:
    branches:
      - "*"
    paths:
      - "materialsystem/shaderapidxxvk/**"
      - ".github/workflows/dxvk-check.yml"

jobs:
  dxvk-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libvulkan-dev libsdl2-dev libpng-dev libjpeg-dev libfreetype6-dev libfontconfig1-dev libcurl4-gnutls-dev libbz2-dev libedit-dev zlib1g-dev
    - name: Build DXVK module only
      run: |
        git submodule init && git submodule update
        python3 waf configure -T release --disable-warns --enable-opus
        python3 waf build --target=shaderapidxxvk -j$(nproc)

  dxvk-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.3.290.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
    - name: Build DXVK module only
      run: |
        git submodule init;git submodule update
        ./waf.bat configure -T release --disable-warns --enable-opus
        ./waf.bat build --target=shaderapidxxvk -j4

  dxvk-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.3.290.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
    - name: Install deps
      run: |
        brew install sdl2 pkg-config
    - name: Build DXVK module only
      run: |
        git submodule init && git submodule update
        python3 waf configure -T release --disable-warns --enable-opus
        python3 waf build --target=shaderapidxxvk -j$(sysctl -n hw.ncpu)
