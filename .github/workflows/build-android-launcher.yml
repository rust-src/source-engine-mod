name: build-android-launcher

on:
  push:
    branches:
      - android-launcher
    paths:
      - 'android-launcher/**'
      - '.github/workflows/build-android-launcher.yml'
  pull_request:
    paths:
      - 'android-launcher/**'
      - '.github/workflows/build-android-launcher.yml'
  workflow_dispatch:

jobs:
  build-launcher:
    name: Build Launcher (Signed APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android-launcher

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Validate wrapper + signing files
        run: |
          test -f ./gradlew || { echo "gradlew missing in git!"; exit 1; }
          test -f ./gradle/wrapper/gradle-wrapper.jar || { echo "gradle-wrapper.jar missing!"; exit 1; }
          test -f ./app/debug.keystore || { echo "signing keystore missing! (expected android-launcher/app/debug.keystore)"; exit 1; }
          chmod +x ./gradlew
          ls -l ./gradlew ./gradle/wrapper/ ./app/debug.keystore

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 安装并配置 Android SDK (platform-34 / build-tools 34.0.0 / cmdline-tools / platform-tools)
      # apksigner / zipalign 均来自 build-tools;34.0.0
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            cmdline-tools;latest
            build-tools;34.0.0
            platforms;android-34
            platform-tools
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'true'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-launcher-${{ hashFiles('android-launcher/**/*.gradle*', 'android-launcher/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-launcher-

      - name: Assemble 4 variants (withLibs + nolibs × debug + release)
        id: assemble
        run: |
          ./gradlew \
            :app:assembleWithLibsDebug :app:assembleWithLibsRelease \
            :app:assembleNoLibsDebug :app:assembleNoLibsRelease \
            --stacktrace --no-daemon \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true

          echo "=== build outputs ==="
          find app/build/outputs -maxdepth 6 -type f \( -name "*.apk" -o -name "*.aab" \) -print0 | xargs -0 -r ls -lh

      - name: Verify APK signatures with apksigner
        id: verify
        if: success()
        run: |
          # 找出 build-tools 路径（取最大版本号）
          BT_ROOT="$ANDROID_SDK_ROOT/build-tools"
          BT_VER=$(ls -1 "$BT_ROOT" | sort -Vr | head -n1)
          APKSIGNER="$BT_ROOT/$BT_VER/apksigner"
          echo "Using apksigner: $APKSIGNER (build-tools $BT_VER)"
          chmod +x "$APKSIGNER" 2>/dev/null || true

          FAIL=0
          # 验证 4 个 variant 目录下所有 APK：
          #   apk/withLibs/debug/ + apk/withLibs/release/
          #   apk/nolibs/debug/   + apk/nolibs/release/
          for APK in \
            app/build/outputs/apk/withLibs/debug/*.apk \
            app/build/outputs/apk/withLibs/release/*.apk \
            app/build/outputs/apk/nolibs/debug/*.apk \
            app/build/outputs/apk/nolibs/release/*.apk
          do
            test -f "$APK" || continue
            echo
            echo "=========================================================================="
            echo "==> Verifying: $APK"
            echo "=========================================================================="
            if "$APKSIGNER" verify --verbose --print-certs "$APK"; then
              echo "[OK] $APK signature verified"
            else
              echo "[FAIL] $APK failed signature verification"
              FAIL=1
            fi
            "$APKSIGNER" verify -v "$APK" 2>&1 | grep -E "^(Verified using|APK signature scheme)" || true
            # 统计 nolibs 的 APK 应该不含任何 .so
            if echo "$APK" | grep -q "nolibs"; then
              SO_COUNT=$(unzip -l "$APK" 2>/dev/null | grep -cE "\.so$" || echo 0)
              echo "==> nolibs APK .so count: $SO_COUNT (expect 0)"
              if [ "$SO_COUNT" -ne 0 ]; then
                echo "::error:: nolibs APK still contains .so files ($SO_COUNT)! ABORT"
                FAIL=1
              fi
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error:: One or more APKs failed checks (apksigner / nolibs-has-so)"
            exit 1
          fi

      - name: Upload Signed APKs (with libs)
        if: success() || (steps.assemble.outcome == 'success' && steps.verify.outcome == 'success')
        uses: actions/upload-artifact@v5
        with:
          name: launcher-signed-withLibs-apk
          path: |
            android-launcher/app/build/outputs/apk/withLibs/debug/*.apk
            android-launcher/app/build/outputs/apk/withLibs/release/*.apk
          if-no-files-found: error

      - name: Upload Signed APKs (nolibs / 空壳)
        if: success() || (steps.assemble.outcome == 'success' && steps.verify.outcome == 'success')
        uses: actions/upload-artifact@v5
        with:
          name: launcher-signed-nolibs-apk
          path: |
            android-launcher/app/build/outputs/apk/nolibs/debug/*.apk
            android-launcher/app/build/outputs/apk/nolibs/release/*.apk
          if-no-files-found: error

      - name: Upload mapping / proguard outputs (optional)
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: launcher-mappings
          path: |
            android-launcher/app/build/outputs/mapping/**/*
          if-no-files-found: ignore
