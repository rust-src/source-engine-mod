name: build-android-launcher

on:
  push:
    branches:
      - android-launcher
    paths:
      - 'android-launcher/**'
      - '.github/workflows/build-android-launcher.yml'
  pull_request:
    paths:
      - 'android-launcher/**'
      - '.github/workflows/build-android-launcher.yml'
  workflow_dispatch:

jobs:
  build-launcher:
    name: Build Launcher (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: android-launcher

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      # 先确认我们提交的 gradlew 文件存在
      - name: Validate wrapper files
        run: |
          test -f ./gradlew || { echo "gradlew missing in git!"; exit 1; }
          test -f ./gradle/wrapper/gradle-wrapper.jar || { echo "gradle-wrapper.jar missing!"; exit 1; }
          chmod +x ./gradlew
          ls -l ./gradlew ./gradle/wrapper/

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 安装并配置 Android SDK (platform-34 / build-tools 34.0.0 / cmdline-tools / platform-tools)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            cmdline-tools;latest
            build-tools;34.0.0
            platforms;android-34
            platform-tools
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'true'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-launcher-${{ hashFiles('android-launcher/**/*.gradle*', 'android-launcher/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-launcher-

      - name: Assemble Debug
        id: assemble
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true

      - name: Assemble Release (AAB + APK)
        id: assembleRelease
        if: success()
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon \
            -Dorg.gradle.parallel=true || true  # 允许 release 签名失败（没有 key 的情况下），但 debug 已经产出

      - name: Upload APK
        if: success() || steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: launcher-debug-apk
          path: |
            android-launcher/app/build/outputs/apk/debug/*.apk
            android-launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB (if any)
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: launcher-release-aab
          path: |
            android-launcher/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Upload mapping / proguard outputs
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: launcher-mappings
          path: |
            android-launcher/app/build/outputs/mapping/**/*
          if-no-files-found: ignore
