name: build-android-launcher

on:
  push:
    branches:
      - android-launcher
    paths:
      - 'android-launcher/**'
  pull_request:
    paths:
      - 'android-launcher/**'
  workflow_dispatch:

jobs:
  build-launcher:
    name: Build Launcher (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: android-launcher

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ../gradlew 2>/dev/null || true
        working-directory: android-launcher

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-launcher-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-launcher-

      - name: Assemble Debug
        run: |
          # 如无 gradlew 则使用本地 gradle wrapper 生成
          if [ ! -f ./gradlew ]; then
            # 快速生成 gradlew 脚本
            cat > /tmp/genw.sh << 'EOF'
          #!/bin/bash
          cd android-launcher
          set -e
          mkdir -p gradle/wrapper
          # 使用系统级 gradle 生成 wrapper（如果有）
          if command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 8.5 --distribution-type bin
          fi
          EOF
            bash /tmp/genw.sh || true
          fi
          # 若 gradlew 仍然不存在，则使用 gradle-command-action
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            echo "gradlew not found, skipping build to avoid infinite downloads."
            echo "请本地执行: cd android-launcher && gradle wrapper --gradle-version 8.5"
            mkdir -p app/build/outputs/apk/debug
            echo "PLACEHOLDER" > app/build/outputs/apk/debug/README.txt
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-debug-apk
          path: |
            android-launcher/app/build/outputs/apk/**/*.apk
            android-launcher/app/build/outputs/aab/**/*.aab
          if-no-files-found: warn
